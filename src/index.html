<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="求职作战台">
<meta name="description" content="刘展博的求职投递作战台：今天要做、岗位池、投递管道与自荐信">
<!--__PWA_HEAD__-->
<title>求职作战台</title>
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">求职作战<em>台</em></div>
    <div class="date" id="today-date"></div>
    <div class="acts">
      <button class="ibtn" id="btn-add" aria-label="手动录入岗位">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4.4v11.2M4.4 10h11.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="ibtn" id="btn-more" aria-label="数据与设置">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="4.6" cy="10" r="1.35" fill="currentColor"/>
          <circle cx="10" cy="10" r="1.35" fill="currentColor"/>
          <circle cx="15.4" cy="10" r="1.35" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabs">
  <button data-tab="today" class="on">
    <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
    </svg>
    <span>今日</span>
  </button>
  <button data-tab="jobs">
    <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
      <rect x="3.2" y="4" width="13.6" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M3.2 8.2h13.6M7.6 4V2.6M12.4 4V2.6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <span>岗位</span>
  </button>
  <button data-tab="pipeline">
    <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M3.4 5.6h13.2M3.4 10h8.6M3.4 14.4h5.2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="badge hidden" id="tab-badge">0</span>
    <span>投递</span>
  </button>
  <button data-tab="letters">
    <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M4 3.4h8.2L16 7.2V16.6H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M6.6 8.4h6.2M6.6 11.4h6.2M6.6 14.4h3.6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </svg>
    <span>自荐信</span>
  </button>
</nav>

<script>
window.__DATA__ = /*__DATA__*/;
window.__META__ = /*__META__*/;
window.__STATE__ = /*__STATE__*/;
/*__STORE__*/
/*__APP__*/
</script>
</body>
</html>
